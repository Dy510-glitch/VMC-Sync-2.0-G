<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMC Sync - Villagers Montessori College Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPBAR HEADER -->
  <header class="fb-topbar">
    <a href="index.html" class="topbar-brand">
      <div class="brand-logo-img" style="font-weight: 800; font-size: 18px; color: var(--accent-blue);">VMC</div>
      <h1 class="brand-title">VMC Sync</h1>
    </a>

    <div class="topbar-search">
      <input type="text" id="global-search" class="search-input" placeholder="Search VMC Sync (posts, assignments, items)...">
    </div>

    <div class="topbar-actions">
      <button id="theme-toggle-btn" class="theme-btn tooltip-bottom" data-tooltip="Toggle Theme">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
      <div class="topbar-user">
        <div class="avatar-placeholder">R</div>
        <span class="user-name">Randy T.</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="fb-container">
    
    <!-- LEFT SIDEBAR: QUICK NAVIGATION & APPS -->
    <aside class="fb-sidebar-left">
      <div class="sidebar-card">
        <h3 class="sidebar-title"><i class="fa-solid fa-compass"></i> Navigation Hub</h3>
        <div class="app-filter-bar">
          <button class="app-chip active" data-view="feed">Campus Feed</button>
          <button class="app-chip" data-view="assignments">Assignments</button>
          <button class="app-chip" data-view="toolkit">Student Toolkit</button>
          <button class="app-chip" data-view="lostfound">Lost & Found</button>
        </div>
      </div>

      <div class="sidebar-card">
        <h4 class="tab-subtitle">Campus Status</h4>
        <div id="status-pill-box" class="result-box-sm">
          <i class="fa-solid fa-circle-check"></i> <span id="display-campus-status">Campus Open</span>
        </div>
      </div>
    </aside>

    <!-- CENTER CONTENT FEED / ACTIVE VIEW -->
    <main class="fb-main-content">
      
      <!-- VIEW 1: CAMPUS FEED -->
      <div id="view-feed" class="portal-view">
        <div class="sidebar-card post-creator-card">
          <div class="creator-header">
            <div class="avatar-placeholder" style="width:32px; height:32px; font-size:14px;">R</div>
            <button id="post-input-trigger">Share an update, academic note, or question...</button>
          </div>
          <div class="creator-actions">
            <button class="action-btn" onclick="openPostModal('General')"><i class="fa-solid fa-pen-to-square" style="color:#2d88ff;"></i> General Post</button>
            <button class="action-btn" onclick="openPostModal('Academic')"><i class="fa-solid fa-book" style="color:#31a24c;"></i> Academic</button>
            <button class="action-btn" onclick="openPostModal('Urgent')"><i class="fa-solid fa-triangle-exclamation" style="color:#e41e3f;"></i> Urgent Note</button>
          </div>
        </div>

        <div class="feed-filter-bar">
          <button class="feed-filter-btn active" onclick="filterFeed('All', this)">All Posts</button>
          <button class="feed-filter-btn" onclick="filterFeed('Academic', this)">Academic</button>
          <button class="feed-filter-btn" onclick="filterFeed('Urgent', this)">Urgent</button>
        </div>

        <div id="feed-posts-container">
          <!-- Dynamic posts rendered here -->
        </div>
      </div>

      <!-- VIEW 2: ASSIGNMENTS -->
      <div id="view-assignments" class="portal-view" style="display: none;">
        <div class="sidebar-card">
          <h3 class="sidebar-title"><i class="fa-solid fa-list-check"></i> Assignment Tracker</h3>
          <form id="add-task-form" class="stacked-form" style="margin-bottom: 16px;">
            <input type="text" id="task-title" class="input-field" placeholder="Assignment Title (e.g. IT101 System Specs)" required>
            <div class="form-row">
              <input type="text" id="task-course" class="input-field" placeholder="Course Code" required>
              <input type="date" id="task-due" class="input-field" required>
            </div>
            <select id="task-priority" class="input-field">
              <option value="High">High Priority</option>
              <option value="Medium" selected>Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>
            <button type="submit" class="btn-primary-sm" style="width:100%;">Add Assignment</button>
          </form>

          <div class="table-responsive">
            <table class="toolkit-table">
              <thead>
                <tr>
                  <th>Status</th>
                  <th>Title</th>
                  <th>Course</th>
                  <th>Due</th>
                  <th>Priority</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="task-table-body">
                <!-- Tasks dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- VIEW 3: STUDENT TOOLKIT (GPA & RESOURCES) -->
      <div id="view-toolkit" class="portal-view" style="display: none;">
        <div class="sidebar-card">
          <h3 class="sidebar-title"><i class="fa-solid fa-calculator"></i> GPA Calculator</h3>
          <div id="gpa-rows-container">
            <div class="form-row gpa-row">
              <input type="text" placeholder="Subject" class="input-field gpa-subject">
              <input type="number" placeholder="Units" class="input-field gpa-units" min="1" max="6" value="3">
              <select class="input-field gpa-grade">
                <option value="1.0">1.00</option>
                <option value="1.25">1.25</option>
                <option value="1.5">1.50</option>
                <option value="1.75">1.75</option>
                <option value="2.0">2.00</option>
                <option value="2.25">2.25</option>
                <option value="2.5">2.50</option>
                <option value="3.0">3.00</option>
                <option value="5.0">5.00</option>
              </select>
            </div>
          </div>
          <div class="toolkit-action-row">
            <button id="add-gpa-row" class="btn-secondary-sm">Add Subject</button>
            <button id="calc-gpa-btn" class="btn-primary-sm">Calculate GPA</button>
          </div>
          <div id="gpa-result-display" class="result-box-sm" style="display:none;">Estimated Term GPA: <span id="gpa-score">0.00</span></div>
        </div>
      </div>

      <!-- VIEW 4: LOST & FOUND -->
      <div id="view-lostfound" class="portal-view" style="display: none;">
        <div class="sidebar-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 class="sidebar-title" style="margin:0;"><i class="fa-solid fa-box-open"></i> Lost & Found Registry</h3>
            <button class="btn-primary-sm" onclick="openLostModal()">Report Item</button>
          </div>
          <div id="lostfound-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <!-- Items dynamically loaded -->
          </div>
        </div>
      </div>

    </main>

    <!-- RIGHT SIDEBAR: ANNOUNCEMENTS & WIDGETS -->
    <aside class="fb-sidebar-right">
      <div class="sidebar-card">
        <h4 class="tab-subtitle"><i class="fa-solid fa-bullhorn"></i> Campus Announcements</h4>
        <div id="announcements-container">
          <!-- Announcements populated here -->
        </div>
      </div>
    </aside>

  </div>

  <!-- POST CREATION MODAL -->
  <div id="post-modal" class="modal-overlay" style="display: none;">
    <div class="fb-modal">
      <div class="modal-header">
        <h3 style="margin:0; font-size:16px;">Create Campus Post</h3>
        <button class="close-btn" onclick="closePostModal()">&times;</button>
      </div>
      <form id="create-post-form">
        <input type="hidden" id="modal-post-type" value="General">
        <label class="form-label">What's on your mind?</label>
        <textarea id="modal-post-text" class="input-field" rows="4" placeholder="Share with VMC students..." required></textarea>
        <div class="modal-actions">
          <button type="button" class="btn-secondary-sm" onclick="closePostModal()">Cancel</button>
          <button type="submit" class="btn-primary-sm">Post to Feed</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LOST ITEM REPORT MODAL -->
  <div id="lost-modal" class="modal-overlay" style="display: none;">
    <div class="fb-modal">
      <div class="modal-header">
        <h3 style="margin:0; font-size:16px;">Report Lost or Found Item</h3>
        <button class="close-btn" onclick="closeLostModal()">&times;</button>
      </div>
      <form id="report-lost-form">
        <label class="form-label">Item Title</label>
        <input type="text" id="lost-title" class="input-field" placeholder="e.g. Casio Calculator" required>
        <label class="form-label">Type</label>
        <select id="lost-type" class="input-field">
          <option value="Lost">Lost Item</option>
          <option value="Found">Found Item</option>
        </select>
        <label class="form-label">Location</label>
        <input type="text" id="lost-location" class="input-field" placeholder="e.g. 2nd Floor Hallway" required>
        <label class="form-label">Description & Contact Info</label>
        <textarea id="lost-desc" class="input-field" rows="3" placeholder="Provide details..." required></textarea>
        <div class="modal-actions">
          <button type="button" class="btn-secondary-sm" onclick="closeLostModal()">Cancel</button>
          <button type="submit" class="btn-primary-sm">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <script src="vmc-sync-core.js"></script>
</body>
</html>
